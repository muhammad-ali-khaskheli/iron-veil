name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            cp -r "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          else
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
          fi
          ls ~/.local/share/godot/export_templates

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot editor settings for Android
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JDK="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          echo "Android SDK: $SDK"
          echo "Java SDK: $JDK"
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          EOF
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.3.tres
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres
          cat ~/.config/godot/editor_settings-4.tres

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Self-test (parse check + auto-play each mission)
        continue-on-error: true
        run: |
          set +e
          FAIL=0
          for f in scripts/*.gd; do
            out=$(godot --headless --path . --check-only --script "res://$f" 2>&1)
            if echo "$out" | grep -qE "SCRIPT ERROR|Parse Error|Compile Error"; then
              FAIL=1
              echo "::warning title=Parse $f::$(echo "$out" | grep -E 'SCRIPT ERROR|Parse Error|Compile Error|at:' | head -6 | tr '\n' ' ' | cut -c1-800)"
            fi
          done
          for L in 1 2 3; do
            out=$(IV_SMOKE=1 IV_LEVEL=$L timeout 240 godot --headless --path . --fixed-fps 60 --quit-after 40000 2>&1)
            if echo "$out" | grep -q "SMOKE_OK level $L"; then
              echo "::notice title=Smoke level $L::PASSED"
            else
              FAIL=1
              BEAT=$(echo "$out" | grep SMOKE_BEAT | tail -1)
              echo "::warning title=Smoke level $L FAILED::last beat: $BEAT | $(echo "$out" | grep -E 'SCRIPT ERROR|Parse Error|ERROR|at:' | head -8 | tr '\n' ' ' | cut -c1-900)"
            fi
            if echo "$out" | grep -qE "SCRIPT ERROR"; then
              echo "::warning title=Runtime errors L$L::$(echo "$out" | grep -E 'SCRIPT ERROR|at:' | head -10 | tr '\n' ' ' | cut -c1-900)"
            fi
          done
          exit 0

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/IronVeil.apk
          ls -la build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronVeil-apk
          path: build/IronVeil.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Iron Veil build ${{ github.run_number }}
          files: build/IronVeil.apk
